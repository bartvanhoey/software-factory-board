name: Release

# Builds the image for amd64 and arm64 and pushes it to Docker Hub when a version tag (v1.2.3) is pushed.
# Needs two secrets in the `release` environment: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token
# with Read & Write permission). It runs CI first (ci.yml) and publishes only if that passes. Actions are pinned to commit
# SHAs; Dependabot (.github/dependabot.yml) proposes the updates.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # The release is not built unless the CI checks pass on the tagged commit.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    # The Docker Hub secrets live in this environment, which only runs for version tags (see docs/docker-hub-install.md).
    # They are read here, in the job, because a workflow-level `env:` cannot see environment secrets.
    environment: release
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/software-factory-board
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # v1.2.3 -> tags 1.2.3, 1.2 and latest. A pre-release tag (v1.3.0-rc1) does not move latest.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
